site_name: jNO
site_url: https://fhg-iisb.github.io/jNO/
site_description: >-
  jNO (jax Numerical Operators) — a JAX-native library for differentiable numerical
  methods. FEM, FDM and RCWA solvers and scientific machine learning on one
  end-to-end differentiable, jit-compiled substrate.
repo_url: https://github.com/FhG-IISB/jno
repo_name: FhG-IISB/jno
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_root_heading: true
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            docstring_style: google
            docstring_section_style: spacy
            merge_init_into_class: true
            members_order: source
            filters:
              - "!^_"  # skip private members
              - "!^log$"
              - "!^logger$"
            heading_level: 2
            inherited_members: false
            show_bases: false

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: docs
      # Without this a mistyped section name renders an EMPTY code block and --strict
      # still passes, so a broken transclusion is invisible. Verified: it does.
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

not_in_nav: |
  /Docker.md
  /Differential-Operators.md
  /operators/integral.md
  /model-controls/index.md
  /model-controls/mask-freeze.md
  /model-controls/initialize-dtype-tune.md
  /model-controls/diagnostics.md
  /misc.md

