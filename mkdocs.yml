site_name: jNO Documentation
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_root_heading: true
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            docstring_style: google
            docstring_section_style: spacy
            merge_init_into_class: true
            members_order: source
            filters:
              - "!^_"  # skip private members
              - "!^log$"
              - "!^logger$"
            heading_level: 2
            inherited_members: false
            show_bases: false

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: docs
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

not_in_nav: |
  /Docker.md
