[build-system]
requires = ["setuptools>=68", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-neural-operators"
version = "0.2.2"
description = "Jax Neural Operators"
readme = "README.md"
requires-python = ">=3.11, <3.14"
authors = [{ name = "Leon Armbruster", email = "leon.armbruster@iisb.fraunhofer.de" }]
license = "EPL-2.0"
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "jax[cuda]>=0.10.1,<0.11",
    "equinox>=0.11.0",
    "optax>=0.2.0",
    "orbax-checkpoint>=0.6.0",
    "foundax>=0.1.6",

    "pygmsh>=7.0.0",
    "cloudpickle>=3.0.0",
    "einops>=0.7.0",
    "matplotlib>=3.8.0",
    "pylotte>=0.3",
    "shapely>=2.0",
    "paramax>=0.0.5"
]

[project.urls]
Homepage = "https://github.com/FhG-IISB/jno"
Documentation = "https://fhg-iisb.github.io/jNO_docs/"
Source = "https://github.com/FhG-IISB/jno"
Issues = "https://github.com/FhG-IISB/jno/issues"

[project.optional-dependencies]
cuda = ["jax[cuda]>=0.4.30"]

fem = [
    "feax>=0.5.1",
    "diffrax",
    "optimistix",
    "lineax",
]
dev = ["pytest>=7.0", 
        "black>=22.0", 
        "flake8>=4.0", 
        "mypy>=0.950", 
        "feax>=0.5.1",
        "diffrax",
        "optimistix",
        "lineax",
        "paramax", 
        "flax", 
        "xprof", 
        "pylotte", 
        "nevergrad", 
        "lineax", 
        "pyfiglet", 
        "fenics-basix"
]
iree = [
    "iree-base-compiler",
    "iree-base-runtime"
]


[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["jno*"]

[tool.setuptools.package-data]
jno = ["py.typed"]

[tool.uv.workspace]
members = [
    ".",
]

[tool.ruff]
line-length = 124

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module import not at top (common in JAX config-before-import patterns)
    "E731",   # lambda assignment (style preference)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports are intentional in public API files

[tool.mypy]
exclude = '^(build/|jNO\.egg-info/|runs/)'

[dependency-groups]
fem = [
    "feax",
    "diffrax",
    "optimistix",
    "lineax",
    "pyfiglet",
    "fenics-basix",
]
dev = [
    "pytest-xdist>=3.8.0",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
jax-neural-operators = { path = ".", editable = true }
jax-cuda12-plugin = { version = ">=0.10.1,<0.11", extras = ["with-cuda"] }
paramax = ">=0.0.5"

[tool.pixi.environments]
default = { solve-group = "default" }
cuda = { features = ["cuda"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
fem = { features = ["fem"], solve-group = "default" }
iree = { features = ["iree"], solve-group = "default" }

[tool.pixi.tasks]
fmt = "ruff format ."
lint = "ruff check . --fix"
test = "pytest -x --tb=short"
all = "ruff format . && ruff check . --fix && pytest"

# CI tasks: read-only (no auto-fix) and skip slow tests
ci-fmt = "ruff format --check ."
ci-lint = "ruff check ."
ci-test = "pytest -x --tb=short -m 'not slow'"

[tool.pixi.dependencies]
pytest = ">=9.0.3,<10"
ruff = ">=0.9.0"
libglu = "*"
mkdocs = ">=1.6.1,<2"
mkdocs-material = ">=9.0,<10"
pymdown-extensions = ">=10.0"
wandb = ">=0.26.1,<0.27"
