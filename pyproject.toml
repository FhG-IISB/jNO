[build-system]
requires = ["setuptools>=68", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-numerical-operators"
version = "0.3.0"
description = "Differentiable numerical methods in JAX (FEM, FDM, spectral) with scientific machine learning"
readme = "README.md"
requires-python = ">=3.11, <3.14"
authors = [{ name = "Leon Armbruster", email = "leon.armbruster@iisb.fraunhofer.de" }]
license = "EPL-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
# License is expressed via the SPDX `license` field above (PEP 639);
# do not duplicate it as a classifier — modern setuptools rejects that.

dependencies = [
    # Plain (CPU) jax on purpose: the library runs fully on CPU, and the CUDA wheels are a
    # multi-GB download that a laptop / CI / macOS install should not pay for. GPU is one extra
    # away: `pip install jax-numerical-operators[cuda]`. The pin stays tight either way -- jNO
    # tracks a single JAX minor version per release.
    "jax>=0.10.1,<0.11",
    "equinox>=0.11.0",
    "optax>=0.2.0",
    "orbax-checkpoint>=0.6.0",
    "foundax>=0.2.0",

    "pygmsh>=7.0.0",
    "cloudpickle>=3.0.0",
    "einops>=0.7.0",
    "shapely>=2.0",
    "paramax>=0.0.5",
    "blackjax>=1.2",

    "fenics-basix", "matfree>=0.6.1,<0.7",
]

[project.urls]
Homepage = "https://github.com/FhG-IISB/jno"
Documentation = "https://fhg-iisb.github.io/jNO/"
Source = "https://github.com/FhG-IISB/jno"
Issues = "https://github.com/FhG-IISB/jno/issues"

[project.optional-dependencies]
# NVIDIA GPU support: swaps in the CUDA-capable JAX build. Same version pin as the core `jax`
# dependency, so the two can never drift apart silently. To pin a specific CUDA toolkit version
# instead, install JAX from its own index first (see docs/Installation.md).
cuda = ["jax[cuda]>=0.10.1,<0.11"]

# GPU algebraic multigrid (`jno.solve.amg` / `jno.precond.ams` / inner-AMG smoothers) via jaxamg
# (NVIDIA AmgX wrapped as a JAX primitive). It is imported **lazily**, so the core installs WITHOUT it —
# opt in with `pip install jax-numerical-operators[amg]`. Kept out of the core dependencies because it
# builds a CUDA extension against a prebuilt AmgX (2.5+, CUDA 12+, MPI), which otherwise breaks a fresh
# install (and every downstream app that depends on jNO) on machines without that toolchain.
amg = ["jaxamg[cuda13]>=0.1.3,<0.2"]

# ---------------------------------------------------------------------------------------------
# FEM: everything jno.fem reaches for beyond the core install.
#
# `pip install jax-numerical-operators[fem]` is meant to be the one-liner that leaves nothing on the
# table -- adaptive remeshing plus BOTH accelerated sparse-direct backends. Every one of these is
# imported LAZILY, so the core install still works without them and each has its own clear
# ImportError naming the fix.
#
# Environment markers, not optimism: MKL is x86-only, and the CUDA wheels are Linux x86-64, so an
# arm64 mac gets the FEM extra WITHOUT a resolver failure -- it simply lands without the backends
# that cannot run there. Note a marker can gate on platform but not on whether a CUDA *device* is
# present; the cudss wheels install on any linux-x86_64 machine and raise at call time on a host
# with no GPU, which is why `lu(backend=...)` never defaults to them.
fem = [
    "jax-numerical-operators[mesh,pardiso,cudss]",
]
# Anisotropic/adaptive remeshing behind fem.solve(adapt=...).
mesh = ["mmgpy"]
# jno.solve.lu(backend="pardiso") -- Intel MKL PARDISO, multithreaded CPU sparse-direct. The
# fastest FACTORIZATION measured here and the one that reuses its symbolic analysis across a Newton
# step; needs no GPU, so it is also the answer when a factorization exceeds device memory.
pardiso = [
    "pypardiso>=0.4.4; platform_machine == 'x86_64'",
]
# jno.solve.lu(backend="cudss") -- NVIDIA cuDSS. The fastest repeated SOLVE, which is what a
# shift-invert eigensolve and a constant-operator transient are made of.
cudss = [
    "nvmath-python>=1.0; platform_machine == 'x86_64' and sys_platform == 'linux'",
    "nvidia-cudss-cu12; platform_machine == 'x86_64' and sys_platform == 'linux'",
    "cupy-cuda12x; platform_machine == 'x86_64' and sys_platform == 'linux'",
]

dev = ["pytest>=7.0",
        "black>=22.0",
        "flake8>=4.0",
        "mypy>=0.950",
        "paramax",
        "flax",
        "xprof",
        "nevergrad",
        "pyfiglet",
]
iree = [
    "iree-base-compiler",
    "iree-base-runtime"
]
# RCWA (Fourier Modal Method) backend for jno.rcwa. fmmax is imported lazily
# inside jno/rcwa.py, so the core install stays lean and only needs this extra
# when the periodic-layered RCWA solver is actually used.
rcwa = [
    "fmmax",
]


[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["jno*"]

[tool.setuptools.package-data]
jno = ["py.typed"]

[tool.uv.workspace]
members = [
    ".",
]

[tool.ruff]
line-length = 124

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module import not at top (common in JAX config-before-import patterns)
    "E731",   # lambda assignment (style preference)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports are intentional in public API files

[tool.mypy]
exclude = '^(build/|jNO\.egg-info/|runs/)'

[dependency-groups]
# Test/tutorial env extras. matplotlib + diffrax + pyamg are NOT runtime deps (the library
# only imports them lazily, inside try/except); they live here so the tutorial suite
# and the explainability-callback plotting run unmodified in tests.
#
# mmgpy (metric-based local remesher) backs the adaptive-FEM loop in
# jno.utils.solver.fem_adapt. It is imported lazily inside remesh_with_mmg, so the
# core install stays lean; it only needs to be present in the fem/dev test envs.
#
# pyamg powers the host-side setup of the hybrid AMG preconditioner (jno.precond.amg)
# — imported lazily there too; the V-cycle apply stays pure JAX.
fem = [
    "pyfiglet",
    "diffrax",
    "matplotlib",
    "mmgpy>=0.16",
    "pyamg>=5.0",
]
dev = [
    "pytest-xdist>=3.8.0",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
jax-numerical-operators = { path = ".", editable = true }
jax-cuda12-plugin = { version = ">=0.10.1,<0.11", extras = ["with-cuda"] }
paramax = ">=0.0.5"
blackjax = ">=1.2"

[tool.pixi.environments]
# The default environment is CUDA-capable through the explicit `jax-cuda12-plugin` pypi entry
# above — deliberately independent of the published wheel's core dependency, which is plain
# (CPU) jax with GPU behind the `[cuda]` extra. Local dev and the test suite run on GPU either way.
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
fem = { features = ["fem"], solve-group = "default" }
iree = { features = ["iree"], solve-group = "default" }
rcwa = { features = ["rcwa"], solve-group = "default" }

[tool.pixi.tasks]
fmt = "ruff format ."
lint = "ruff check . --fix"
test = "pytest -x --tb=short"
all = "ruff format . && ruff check . --fix && pytest"

# CI tasks: read-only (no auto-fix) and skip slow tests
ci-fmt = "ruff format --check ."
ci-lint = "ruff check ."
ci-test = "pytest -x --tb=short -m 'not slow'"
# Coverage variant used by .github/workflows/ci.yml — emits coverage.xml
# for the codecov upload step. Kept separate from `ci-test` so local
# `pixi run ci-test` stays fast and unannotated.
# Runs each test FILE in its own process (memory released between files) so the
# growing FEM suite does not OOM-kill the CI runner; aggregates coverage.xml.
ci-test-cov = "bash .github/ci_test_per_file.sh"

[tool.pixi.dependencies]
pytest = ">=9.0.3,<10"
pytest-cov = ">=5.0"
ruff = ">=0.9.0"
libglu = "*"
mkdocs = ">=1.6.1,<2"
mkdocs-material = ">=9.0,<10"
mkdocstrings-python = ">=1.10"
pre-commit = ">=4.0"
pymdown-extensions = ">=10.0"
wandb = ">=0.26.1,<0.27"
pyamg = ">=5.3.0,<6"
petsc4py = ">=3.25.4,<4"

[tool.pixi.feature.dev.dependencies]
matplotlib = ">=3.11.0,<4"

[tool.pixi.feature.fem.dependencies]
plotly = ">=6.9.0,<7"
