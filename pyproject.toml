[build-system]
requires = ["setuptools>=68", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-neural-operators"
version = "0.2.3"
description = "Jax Neural Operators"
readme = "README.md"
requires-python = ">=3.11, <3.14"
authors = [{ name = "Leon Armbruster", email = "leon.armbruster@iisb.fraunhofer.de" }]
license = "EPL-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
# License is expressed via the SPDX `license` field above (PEP 639);
# do not duplicate it as a classifier — modern setuptools rejects that.

dependencies = [
    "jax[cuda]>=0.10.1,<0.11",
    "equinox>=0.11.0",
    "optax>=0.2.0",
    "orbax-checkpoint>=0.6.0",
    "foundax>=0.2.0",

    "pygmsh>=7.0.0",
    "cloudpickle>=3.0.0",
    "einops>=0.7.0",
    "matplotlib>=3.8.0",
    "pylotte>=0.3",
    "shapely>=2.0",
    "paramax>=0.0.5"
]

[project.urls]
Homepage = "https://github.com/FhG-IISB/jno"
Documentation = "https://fhg-iisb.github.io/jNO/"
Source = "https://github.com/FhG-IISB/jno"
Issues = "https://github.com/FhG-IISB/jno/issues"

[project.optional-dependencies]
# `cuda` is intentionally *not* a separate extra: the core `jax[cuda]`
# constraint above already covers GPU installs. If you need to override
# the JAX wheel for a specific CUDA version, install JAX from its own
# index (see docs/Installation.md).

fem = [
    "feax>=0.5.1",
    "diffrax",
    "optimistix",
    "lineax",
]
dev = ["pytest>=7.0",
        "black>=22.0",
        "flake8>=4.0",
        "mypy>=0.950",
        "feax>=0.5.1",
        "diffrax",
        "optimistix",
        "lineax",
        "paramax",
        "flax",
        "xprof",
        "pylotte",
        "nevergrad",
        "lineax",
        "pyfiglet",
        "fenics-basix"
]
iree = [
    "iree-base-compiler",
    "iree-base-runtime"
]


[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["jno*"]

[tool.setuptools.package-data]
jno = ["py.typed"]

[tool.uv.workspace]
members = [
    ".",
]

[tool.ruff]
line-length = 124

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module import not at top (common in JAX config-before-import patterns)
    "E731",   # lambda assignment (style preference)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports are intentional in public API files

[tool.mypy]
exclude = '^(build/|jNO\.egg-info/|runs/)'

[dependency-groups]
fem = [
    "feax",
    "diffrax",
    "optimistix",
    "lineax",
    "pyfiglet",
    "fenics-basix",
]
dev = [
    "pytest-xdist>=3.8.0",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
jax-neural-operators = { path = ".", editable = true }
jax-cuda12-plugin = { version = ">=0.10.1,<0.11", extras = ["with-cuda"] }
paramax = ">=0.0.5"

[tool.pixi.environments]
# The default environment already includes a CUDA-capable JAX wheel via
# the core `jax[cuda]` dependency and the `jax-cuda12-plugin` pypi entry
# below — no separate `cuda` environment is needed.
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
fem = { features = ["fem"], solve-group = "default" }
iree = { features = ["iree"], solve-group = "default" }

[tool.pixi.tasks]
fmt = "ruff format ."
lint = "ruff check . --fix"
test = "pytest -x --tb=short"
all = "ruff format . && ruff check . --fix && pytest"

# CI tasks: read-only (no auto-fix) and skip slow tests
ci-fmt = "ruff format --check ."
ci-lint = "ruff check ."
ci-test = "pytest -x --tb=short -m 'not slow'"
# Coverage variant used by .github/workflows/ci.yml — emits coverage.xml
# for the codecov upload step. Kept separate from `ci-test` so local
# `pixi run ci-test` stays fast and unannotated.
ci-test-cov = "pytest -x --tb=short -m 'not slow' --cov=jno --cov-report=xml:coverage.xml --cov-report=term-missing"

[tool.pixi.dependencies]
pytest = ">=9.0.3,<10"
pytest-cov = ">=5.0"
ruff = ">=0.9.0"
libglu = "*"
mkdocs = ">=1.6.1,<2"
mkdocs-material = ">=9.0,<10"
mkdocstrings-python = ">=1.10"
pre-commit = ">=4.0"
pymdown-extensions = ">=10.0"
wandb = ">=0.26.1,<0.27"
