[build-system]
requires = ["setuptools>=68", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-neural-operators"
version = "0.2.0"
description = "Jax Neural Operators"
readme = "README.md"
requires-python = ">=3.11, <3.14"
authors = [{ name = "Leon Armbruster", email = "leon.armbruster@iisb.fraunhofer.de" }]
license = "EPL-2.0"
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "jax>=0.4.30",
    "equinox>=0.11.0",
    "optax>=0.2.0",
    "orbax-checkpoint>=0.6.0",
    "foundax>=0.1.5",

    "pygmsh>=7.0.0",
    "cloudpickle>=3.0.0",
    "einops>=0.7.0",
    "matplotlib>=3.8.0",
]

[project.urls]
Homepage = "https://github.com/FhG-IISB/jno"
Documentation = "https://fhg-iisb.github.io/jNO_docs/"
Source = "https://github.com/FhG-IISB/jno"
Issues = "https://github.com/FhG-IISB/jno/issues"

[project.optional-dependencies]
cuda = [
    "jax[cuda12]"
]
fem = [
    "feax",
    "diffrax",
    "optimistix",
    "lineax",
    "pyfiglet",
    "fenics-basix",
]
dev = ["pytest>=7.0", 
        "black>=22.0", 
        "flake8>=4.0", 
        "mypy>=0.950", 
        "feax",
        "diffrax",
        "optimistix",
        "lineax",
        "paramax", 
        "flax", 
        "xprof", 
        "pylotte", 
        "nevergrad", 
        "lineax", 
        "pyfiglet", 
        "fenics-basix"
]
iree = [
    "iree-base-compiler",
    "iree-base-runtime"
]


[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["jno*"]

[tool.setuptools.package-data]
jno = ["py.typed"]

[tool.uv.workspace]
members = [
    ".",
]

[tool.black]
line-length = 250

[tool.mypy]
exclude = '^(build/|jNO\.egg-info/|runs/)'

[dependency-groups]
fem = [
    "feax",
    "diffrax",
    "optimistix",
    "lineax",
    "pyfiglet",
    "fenics-basix",
]
dev = [
    "pytest-xdist>=3.8.0",
]
