name: Nightly (full suite)

# The complete 232-file suite, unfiltered. This is what makes the PR-side path filtering in ci.yml
# safe: if a filter is scoped too narrowly, the miss surfaces here within a day rather than never.
# Do not add path filters to this workflow -- running everything is its entire purpose.
#
# Scheduled only, deliberately NOT on push to main. The suite takes ~2 h, and anything arriving via
# PR has already run its filtered subset, so a per-push run would mostly re-execute what just
# passed. The trade is that a mis-scoped filter is caught within a day instead of within minutes;
# `workflow_dispatch` is there for when that wait is not acceptable -- run it by hand before a
# release or after a risky merge.
#
# It skips itself when main has not moved since the last attempt -- re-running an identical tree
# tells you nothing you did not already know, and this suite is ~2 h of runner time. The check
# compares HEAD against the last completed run's head SHA rather than asking "were there commits in
# the last 24 h": if a scheduled run is ever dropped (GitHub does drop them under load), a time
# window silently skips the commits that landed during the gap, whereas a SHA comparison still sees
# them. `workflow_dispatch` always runs, so a manual trigger is never skipped.
#
# Coverage is uploaded from HERE and not from a PR, because a filtered PR run only executes part of
# the suite and would report every unexercised file as freshly uncovered.

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false   # never cancel a full run; a partial one proves nothing

permissions:
  contents: read
  actions: read   # to read the previous run's head SHA

jobs:
  # ---------------------------------------------------------------- has anything changed?
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual dispatch -> running"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          head="$(git rev-parse HEAD)"
          # The last COMPLETED attempt, whatever its conclusion: if main has not moved since a run
          # that already failed, re-running it just reproduces a failure that is already reported.
          prev="$(gh run list --workflow=nightly.yml --branch=main --status=completed \
                    --limit=1 --json headSha --jq '.[0].headSha // ""' 2>/dev/null || echo "")"
          echo "head=$head"; echo "prev=${prev:-<none>}"
          if [ -z "$prev" ] || [ "$prev" != "$head" ]; then
            echo "main moved (or no previous run) -> running"; echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "main unchanged since the last attempt -> skipping"; echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  full:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      # One process per test FILE. The all-in-one run accumulates JAX device buffers and coverage
      # state across the suite and gets OOM-killed part-way through on a hosted runner.
      - name: Full test suite
        run: pixi run ci-test-cov

      - name: Upload coverage to Codecov
        if: '!cancelled()'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: nightly
          fail_ci_if_error: false
