name: Docker Release

on:
  release:
    types: [published]
  # To (re)publish the image for an existing release, e.g. when the release run failed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v0.4.0"
        required: true
      latest:
        description: "Also tag the image as latest"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  # ------------------------------------------------------------------
  # Build a single linux/amd64 image, smoke-test it, then push it.
  #
  # No full test suite here: it takes ~3.5 h and kept hitting the job timeout, so the image was never
  # pushed. The suite already gates the code in ci.yml and nightly.yml (and the same code is on PyPI);
  # the smoke test checks what the image itself can break -- installed version, gmsh's system libraries,
  # an end-to-end FEM solve.
  # ------------------------------------------------------------------
  build:
    name: Build, smoke-test & push image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      # The smoke test comes from the workflow's own commit, so a manual run can test an older tag.
      - uses: actions/checkout@v4
        with:
          path: _workflow
          sparse-checkout: .github/docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' || inputs.latest }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: jno-smoke:local
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm -v "$PWD/_workflow/.github/docker:/smoke:ro" jno-smoke:local \
            pixi run python /smoke/smoke_test.py "${RELEASE_TAG#v}"

      - name: Push image
        # Same inputs as "Build image", so every layer comes from the cache: this only pushes.
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
