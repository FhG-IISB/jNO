name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      - name: Check formatting
        run: pixi run ci-fmt

      - name: Lint
        run: pixi run ci-lint

      - name: Test
        run: pixi run ci-test
