name: CI

# PR gate: fast and targeted. The full suite lives in nightly.yml (scheduled, plus
# workflow_dispatch) -- so a mis-scoped filter here costs at most a day of latency, while a PR that
# only touches one area stops paying for the other areas. Run the nightly by hand before a release
# if that day of latency matters.
#
# Runtimes that motivated the split: the all-in-one suite took 1h41m-2h07m per PR and was being
# cancelled. Over half of the test files are test_fem_*, so a non-FEM change was paying for the FEM
# suite and vice versa.
#
# Each group then runs as balanced shards in parallel (.github/ci_plan.py, from the per-file times
# in .github/ci_file_times.tsv). Run one after the other, `fem` took 3h17m-4h12m and `core` 1h33m-
# 2h12m on a single runner each; split to ~30 min per shard, the slowest shard sets the PR's wait.
# The JAX compile cache is kept between runs per shard: with it warm, tests/test_fem_rosenbrock.py
# went from 50 s to 29 s. PR runs take no coverage (see .github/ci_test_per_file.sh).

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- what changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            shared:
              - 'jno/trace/**'
              - 'jno/np/**'
              - 'jno/np.py'
              - 'jno/__init__.py'
              - 'jno/utils/ad_mode.py'
              - 'jno/utils/schemes.py'
              - 'pyproject.toml'
              - 'pixi.lock'
              - 'pytest.ini'
              - '.github/workflows/ci.yml'
              - '.github/ci_test_per_file.sh'
              - '.github/ci_plan.py'
            fem:
              - 'jno/_fem.py'
              - 'jno/fem*'
              - 'jno/utils/solver/**'
              - 'jno/precond.py'
              - 'jno/solve.py'
              - 'tests/test_fem*'
            geometry:
              - 'jno/domain/**'
              - 'jno/geometry/**'
              - 'tests/test_domain*'
              - 'tests/test_shape*'
              - 'tests/test_polygon*'
              - 'tests/test_mesh*'
            rcwa:
              - 'jno/rcwa**'
              - 'jno/litho*'
              - 'tests/test_rcwa*'
            fdm:
              - 'jno/fdm.py'
              - 'tests/test_fdm*'
            core:
              - 'jno/**'
              - 'tests/**'

      # `shared` forces every group: a change under jno/trace, jno/np or the build files can break any
      # area, and guessing which would be exactly the mis-scoping this design is trying to avoid.
      - id: plan
        run: |
          # paths-filter's `changes` output is the JSON list of the filters that matched.
          hits='${{ steps.f.outputs.changes }}'
          groups=()
          for g in fem geometry rcwa fdm core; do
            if jq -e --arg g "$g" 'index("shared") or index($g)' <<< "$hits" > /dev/null; then groups+=("$g"); fi
          done
          echo "groups: ${groups[*]:-<none>}"
          if [ "${#groups[@]}" -eq 0 ]; then echo "any=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "any=true" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python3 .github/ci_plan.py matrix "${groups[@]}")" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- always
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
      - run: pixi run ci-fmt
      - run: pixi run ci-lint

  # ---------------------------------------------------------------- targeted suites, sharded
  test:
    name: test (${{ matrix.group }} ${{ matrix.shard }}/${{ matrix.of }})
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      # Keyed per shard and per lockfile (a new JAX invalidates every entry). A PR restores the newest
      # cache of its own earlier runs, else the nightly's on main; entries are keyed by the program's
      # hash, so a stale one is never loaded, only unused. Saved even when tests fail.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/jno
          key: jno-xla-${{ matrix.group }}-${{ matrix.shard }}of${{ matrix.of }}-${{ hashFiles('pixi.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: jno-xla-${{ matrix.group }}-${{ matrix.shard }}of${{ matrix.of }}-${{ hashFiles('pixi.lock') }}-

      - name: Select this shard's files
        run: python3 .github/ci_plan.py files ${{ matrix.group }} ${{ matrix.shard }} ${{ matrix.of }} | tee files.txt

      - name: Test ${{ matrix.group }} ${{ matrix.shard }}/${{ matrix.of }}
        run: pixi run -- bash .github/ci_test_per_file.sh $(cat files.txt)

      - uses: actions/cache/save@v4
        if: '!cancelled()'
        with:
          path: ~/.cache/jno
          key: jno-xla-${{ matrix.group }}-${{ matrix.shard }}of${{ matrix.of }}-${{ hashFiles('pixi.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@v4
        if: '!cancelled()'
        with:
          name: file-times-${{ matrix.group }}-${{ matrix.shard }}of${{ matrix.of }}
          path: ci-file-times.tsv
          retention-days: 14
