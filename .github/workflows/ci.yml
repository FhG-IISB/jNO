name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      - name: Check formatting
        run: pixi run ci-fmt

      - name: Lint
        run: pixi run ci-lint

      - name: Test (with coverage)
        run: pixi run ci-test-cov

      # Public-repo upload works without a token (codecov-action uses OIDC).
      # For private repos, set the CODECOV_TOKEN secret and uncomment the
      # `token:` line. Codecov must be enabled for the repo on codecov.io
      # before the first upload will be visible.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
          # token: ${{ secrets.CODECOV_TOKEN }}
