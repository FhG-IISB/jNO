name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # OIDC token for PyPI trusted publishing -- this is what stands in for an API token.
      id-token: write
    # These three must match the trusted publisher registered on PyPI for the project:
    # owner/repo `FhG-IISB/jNO`, workflow file `publish-pypi.yml`, environment `pypi`. Renaming this
    # environment, this file, or the repo silently stops matching, and the upload is rejected at
    # publish time -- so change them together with the PyPI side. `pypi` is an environment that
    # already exists on the repo; creating a differently-named one needs admin.
    environment:
      name: pypi
      url: https://pypi.org/p/jax-numerical-operators
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish package to PyPI
        # No `user`/`password`: with the trusted publisher above the action mints a short-lived token
        # from the OIDC identity. Passing an API token here would take precedence and bypass it.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
